name: release

# Push a tag like v0.1.0 (or run manually with a tag) to build installers for
# Windows, macOS (Apple Silicon + Intel) and Linux and attach them to a GitHub Release.
# Builds are signed for the in-app updater (secret TAURI_SIGNING_PRIVATE_KEY); once every
# platform is built, latest.json is attached and the release is published, which is what
# installed copies check for updates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "myCapture $TAG" --notes-file .github/release-notes.md --target "$GITHUB_SHA"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Fetch ffmpeg to ship inside the Windows installer
        if: runner.os == 'Windows'
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          7z e ffmpeg.zip -oapp/bin "*/bin/ffmpeg.exe" -y
          app/bin/ffmpeg.exe -version | head -1

      - name: Build installers
        working-directory: app
        # Optional OAuth app keys for the cloud drives; without them users register their own app.
        env:
          MYCAPTURE_DROPBOX_KEY: ${{ secrets.MYCAPTURE_DROPBOX_KEY }}
          MYCAPTURE_ONEDRIVE_CLIENT_ID: ${{ secrets.MYCAPTURE_ONEDRIVE_CLIENT_ID }}
          MYCAPTURE_GDRIVE_CLIENT_ID: ${{ secrets.MYCAPTURE_GDRIVE_CLIENT_ID }}
          MYCAPTURE_GDRIVE_SECRET: ${{ secrets.MYCAPTURE_GDRIVE_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "Windows" ] && EXTRA="--config tauri.ffmpeg.conf.json"
          cargo tauri build --target ${{ matrix.target }} $EXTRA

      - name: Build server
        run: cargo build --release -p mycapture-server --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          B=target/${{ matrix.target }}/release/bundle
          find "$B" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*-setup.exe.sig' -o -name '*.AppImage.sig' \) -exec cp {} dist/ \;
          # macOS updater bundle: both architectures are called myCapture.app.tar.gz, so name them apart.
          for f in "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "dist/$(basename "$f" | sed "s/\.app\.tar\.gz/_${{ matrix.label }}.app.tar.gz/")"
          done
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/mycapture-server$EXT" "dist/mycapture-server-${{ matrix.label }}$EXT"
          ls -la dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

  # Point installed copies at this release, then publish it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write latest.json and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig'
          ls -la
          VERSION="${TAG#v}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          NOTES=$(git log --no-merges --format='- %s' ${PREV:+$PREV..}"$TAG" | head -20)
          python3 - "$VERSION" "$NOTES" <<'PY'
          import json, sys, glob, os, datetime
          version, notes = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/"
          want = {
              'windows-x86_64': '*-setup.exe.sig',
              'darwin-aarch64': '*macos-arm64.app.tar.gz.sig',
              'darwin-x86_64': '*macos-x64.app.tar.gz.sig',
              'linux-x86_64': '*.AppImage.sig',
          }
          platforms = {}
          for key, pattern in want.items():
              found = glob.glob(pattern)
              if found:
                  sig = found[0]
                  platforms[key] = {'signature': open(sig).read().strip(), 'url': base + sig[:-4]}
          if 'windows-x86_64' not in platforms:
              sys.exit('no signed Windows installer: is TAURI_SIGNING_PRIVATE_KEY set?')
          out = {'version': version, 'notes': notes, 'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'platforms': platforms}
          json.dump(out, open('latest.json', 'w'), indent=2)
          print(json.dumps(out, indent=2))
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
