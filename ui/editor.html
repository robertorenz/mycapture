<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myCapture — Preview</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: auto 1fr; height: 100vh; }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0;
  }
  header img { width: 26px; height: 26px; }
  header .meta { display: flex; flex-direction: column; min-width: 0; }
  header .meta b { font-size: 14px; }
  header .meta span { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  #urlChip {
    display: none; align-items: center; gap: 8px; max-width: 46%; height: 32px; padding: 0 12px; border-radius: 999px;
    background: rgba(56, 189, 248, .1); border: 1px solid rgba(56, 189, 248, .35); color: #bae6fd; cursor: pointer; font-size: 12.5px;
  }
  #urlChip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #tools {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; border-right: 1px solid var(--line);
    background: var(--panel); overflow-y: auto;
  }
  #tools .t {
    width: 40px; height: 40px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: #c3cbe0;
    display: grid; place-items: center; cursor: pointer; position: relative;
  }
  #tools .t:hover { background: var(--panel-2); }
  #tools .t.on { background: rgba(245, 158, 11, .14); border-color: rgba(245, 158, 11, .55); color: var(--accent); }
  #tools .t svg.i { width: 20px; height: 20px; }
  #tools hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .sw { width: 24px; height: 24px; border-radius: 50%; margin: 3px auto; cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .sz { height: 26px; width: 40px; border-radius: 7px; display: grid; place-items: center; cursor: pointer; }
  .sz:hover { background: var(--panel-2); }
  .sz.on { background: var(--panel-2); outline: 1px solid var(--line); }
  .sz i { display: block; background: #c3cbe0; border-radius: 4px; width: 22px; }

  #stage {
    position: relative; overflow: hidden; display: grid; place-items: center; padding: 64px 20px 20px;
    background-color: #0a101c;
    background-image: radial-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  #canvas { box-shadow: 0 10px 40px rgba(0, 0, 0, .55); border-radius: 4px; cursor: crosshair; background: #fff; }
  video { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, .55); background: #000; outline: none; }
  #txt {
    position: absolute; display: none; min-width: 60px; background: rgba(255, 255, 255, .06); border: 1px dashed var(--accent);
    outline: none; padding: 0 2px; resize: none; overflow: hidden; font-weight: 700; line-height: 1.2;
    font-family: "Segoe UI", -apple-system, sans-serif; white-space: pre; user-select: text;
  }

  #opts {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; display: none;
    align-items: center; gap: 4px; padding: 5px 6px; border-radius: 12px;
    background: rgba(17, 26, 46, .96); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  #opts.show { display: flex; }
  #opts .lab { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 0 6px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  #opts button {
    width: 46px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: #c3cbe0; display: grid; place-items: center; cursor: pointer;
  }
  #opts button:hover { background: var(--panel-2); }
  #opts button.on { background: rgba(245, 158, 11, .14); border-color: rgba(245, 158, 11, .55); color: var(--accent); }
  #opts svg { width: 34px; height: 22px; }

  footer {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  footer .hint { color: var(--muted); font-size: 12px; margin-left: 6px; }
  body.video #tools { display: none; }
  body.video .img-only { display: none; }
  body.image .vid-only { display: none; }
</style>
</head>
<body>
<header>
  <img src="moon.png" alt="">
  <div class="meta"><b id="title">Loading…</b><span id="sub"></span></div>
  <div class="spacer"></div>
  <div id="urlChip" title="Click to copy the link"><span data-icon="link"></span><span id="urlText"></span></div>
  <button class="btn ghost" id="hist" data-icon="history">History</button>
</header>

<aside id="tools">
  <button class="t" data-tool="select" title="Select &amp; edit (V)" data-icon="pointer"></button>
  <button class="t on" data-tool="arrow" title="Arrow (A)" data-icon="arrow"></button>
  <button class="t" data-tool="rect" title="Box (R)" data-icon="rect"></button>
  <button class="t" data-tool="ellipse" title="Ellipse (E)" data-icon="ellipse"></button>
  <button class="t" data-tool="highlight" title="Highlighter (H)" data-icon="highlight"></button>
  <button class="t" data-tool="pen" title="Pen (P)" data-icon="pen"></button>
  <button class="t" data-tool="text" title="Text (T)" data-icon="text"></button>
  <button class="t" data-tool="callout" title="Callout (C)" data-icon="callout"></button>
  <button class="t" data-tool="step" title="Numbered step (N)" data-icon="step"></button>
  <button class="t" data-tool="blur" title="Pixelate (B)" data-icon="blur"></button>
  <hr>
  <div id="swatches"></div>
  <hr>
  <div class="sz" data-size="1" title="Thin"><i style="height:2px"></i></div>
  <div class="sz on" data-size="1.8" title="Medium"><i style="height:4px"></i></div>
  <div class="sz" data-size="3" title="Thick"><i style="height:7px"></i></div>
  <hr>
  <button class="t" id="undo" title="Undo (Ctrl+Z)" data-icon="undo"></button>
  <button class="t" id="redo" title="Redo (Ctrl+Y)" data-icon="redo"></button>
</aside>

<main id="stage">
  <canvas id="canvas" class="img-only"></canvas>
  <video id="video" class="vid-only" controls></video>
  <img id="gif" class="vid-only" alt="" style="display:none;max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.55)">
  <textarea id="txt" rows="1" spellcheck="false"></textarea>
  <div id="opts"></div>
</main>

<footer>
  <button class="btn primary img-only" id="copy" data-icon="copy">Copy image</button>
  <button class="btn primary vid-only" id="copyVid" data-icon="copy">Copy video</button>
  <button class="btn" id="share" data-icon="share">Share link</button>
  <button class="btn img-only" id="copyFile" data-icon="file">Copy as file</button>
  <button class="btn" id="saveAs" data-icon="save">Save as…</button>
  <span class="hint" id="hint">Paste anywhere with Ctrl+V — WhatsApp, Teams, Slack, email…</span>
  <div class="spacer"></div>
  <button class="btn ghost danger" id="del" data-icon="trash">Delete</button>
</footer>

<script src="shared.js"></script>
<script>
hydrateIcons();
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
const isMac = /Mac/.test(navigator.platform);
if (isMac) $('hint').textContent = 'Paste anywhere with ⌘V — WhatsApp, Teams, Slack, email…';

let item = null;
const cv = $('canvas'), ctx = cv.getContext('2d');
const base = new Image();
base.crossOrigin = 'anonymous';
let tool = 'arrow', color = '#ef4444', sizeMult = 1.8;
let shapes = [], undoStack = [], redoStack = [], drawing = null, dirty = false, scale = 1;
let selected = null, drag = null, exporting = false;
const COLORS = ['#ef4444', '#f59e0b', '#facc15', '#10b981', '#38bdf8', '#2563eb', '#ffffff', '#0f172a'];

$('swatches').innerHTML = COLORS.map(c => `<div class="sw${c === color ? ' on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('');
$('swatches').addEventListener('click', e => {
  const c = e.target.dataset.c;
  if (!c) return;
  color = c;
  document.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s.dataset.c === c));
  if (selected) { snapshot(); selected.color = c; render(); }
});
document.querySelectorAll('.sz').forEach(el => el.onclick = () => {
  sizeMult = +el.dataset.size;
  document.querySelectorAll('.sz').forEach(s => s.classList.toggle('on', s === el));
  if (selected && 'size' in selected) { snapshot(); selected.size = sizeMult; render(); }
});
function setTool(t) {
  commitText();
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  if (t !== 'select' && selected && selected.type !== t) select(null);
  setCursor(toolCursor());
  renderOpts();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

// ---------- drawing ----------
const unit = () => Math.max(2, Math.round(Math.hypot(base.naturalWidth || cv.width, base.naturalHeight || cv.height) / 450));
const fontPx = s => Math.round(unit() * 7 * s.size);

// ---------- arrow & callout styles ----------
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let arrowStyle = store.get('arrowStyle', 'classic');
let calloutStyle = store.get('calloutStyle', 'bubble');

const ARROW_STYLES = [
  ['classic', 'Arrow', '<path d="M4 18L24 7" stroke-width="2.5"/><path d="M28 5l-8 1 4 6z" fill="currentColor" stroke="none"/>'],
  ['double', 'Double arrow', '<path d="M8 16L24 8" stroke-width="2.5"/><path d="M28 5l-8 1 4 6zM4 19l8-1-4-6z" fill="currentColor" stroke="none"/>'],
  ['curved', 'Curved arrow', '<path d="M4 18Q8 3 23 7" stroke-width="2.5"/><path d="M28 9l-8-6 0 9z" fill="currentColor" stroke="none"/>'],
  ['fat', 'Block arrow', '<path d="M3 8h16V3l10 8-10 8v-5H3z" fill="currentColor" stroke="none"/>'],
  ['tapered', 'Tapered arrow', '<path d="M4 19L19 9 21 12.5z" fill="currentColor" stroke="none"/><path d="M28 5l-10 2 4.5 7z" fill="currentColor" stroke="none"/>'],
  ['dashed', 'Dashed arrow', '<path d="M4 18L24 7" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M28 5l-8 1 4 6z" fill="currentColor" stroke="none"/>'],
  ['dot', 'Pointer', '<circle cx="6" cy="17" r="3" fill="currentColor" stroke="none"/><path d="M8 16L24 7" stroke-width="2.5"/><path d="M28 5l-8 1 4 6z" fill="currentColor" stroke="none"/>'],
  ['line', 'Line', '<path d="M4 18L28 5" stroke-width="2.5"/>'],
];
const CALLOUT_STYLES = [
  ['bubble', 'Filled bubble', '<rect x="4" y="2" width="26" height="13" rx="5" fill="currentColor" stroke="none"/><path d="M9 14l-3 7 8-7z" fill="currentColor" stroke="none"/>'],
  ['outline', 'Outlined bubble', '<rect x="4.5" y="2.5" width="25" height="12" rx="5" stroke-width="2"/><path d="M10 14.5l-4 6 8-6" stroke-width="2"/>'],
  ['label', 'Square label', '<rect x="4" y="2" width="26" height="13" fill="currentColor" stroke="none"/><path d="M9 14l-4 7 9-7z" fill="currentColor" stroke="none"/>'],
  ['round', 'Speech balloon', '<ellipse cx="17" cy="9" rx="13" ry="7" fill="currentColor" stroke="none"/><path d="M9 13l-4 8 9-6z" fill="currentColor" stroke="none"/>'],
];

function renderOpts() {
  const bar = $('opts');
  const kind = selected && (selected.type === 'arrow' || selected.type === 'callout') ? selected.type : tool;
  const set = kind === 'arrow' ? ARROW_STYLES : kind === 'callout' ? CALLOUT_STYLES : null;
  bar.classList.toggle('show', !!set && item?.kind === 'image');
  if (!set) return;
  const cur = selected?.type === kind ? (selected.style || set[0][0]) : kind === 'arrow' ? arrowStyle : calloutStyle;
  bar.innerHTML = `<span class="lab">${kind === 'arrow' ? 'Arrow' : 'Callout'}</span>` + set.map(([sid, name, svg]) =>
    `<button data-style="${sid}" title="${name}" class="${sid === cur ? 'on' : ''}"><svg viewBox="0 0 32 22" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></button>`).join('');
}
$('opts').addEventListener('mousedown', e => e.stopPropagation());
$('opts').addEventListener('click', e => {
  const b = e.target.closest('[data-style]');
  if (!b) return;
  const kind = selected && (selected.type === 'arrow' || selected.type === 'callout') ? selected.type : tool;
  if (kind === 'arrow') { arrowStyle = b.dataset.style; store.set('arrowStyle', arrowStyle); }
  else { calloutStyle = b.dataset.style; store.set('calloutStyle', calloutStyle); }
  if (selected?.type === kind) { snapshot(); selected.style = b.dataset.style; render(); }
  renderOpts();
});

function head(c, x, y, ang, size) {
  c.beginPath();
  c.moveTo(x, y);
  c.lineTo(x - size * Math.cos(ang - .45), y - size * Math.sin(ang - .45));
  c.lineTo(x - size * Math.cos(ang + .45), y - size * Math.sin(ang + .45));
  c.closePath();
  c.fill();
}

function arrow(c, s) {
  const st = s.style || 'classic';
  const w = unit() * s.size, len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
  if (len < 2) return;
  const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), hs = Math.max(12, w * 4.2);
  const cos = Math.cos(ang), sin = Math.sin(ang);
  c.lineCap = 'round';
  c.lineWidth = w;
  if (st === 'fat' || st === 'tapered') {
    // Filled polygon arrows: shaft half-widths at the tail (t0) and at the head base (t1).
    const hl = Math.min(len * .45, st === 'fat' ? w * 6 : hs * 1.1);
    const hw = st === 'fat' ? w * 3.4 : hs * .55;
    const t0 = st === 'fat' ? w * 1.5 : w * .2, t1 = st === 'fat' ? w * 1.5 : w * .9;
    const bx = s.x2 - cos * hl, by = s.y2 - sin * hl, nx = -sin, ny = cos;
    c.beginPath();
    c.moveTo(s.x1 + nx * t0, s.y1 + ny * t0);
    c.lineTo(bx + nx * t1, by + ny * t1);
    c.lineTo(bx + nx * hw, by + ny * hw);
    c.lineTo(s.x2, s.y2);
    c.lineTo(bx - nx * hw, by - ny * hw);
    c.lineTo(bx - nx * t1, by - ny * t1);
    c.lineTo(s.x1 - nx * t0, s.y1 - ny * t0);
    c.closePath();
    c.fill();
    if (st === 'fat') {
      c.shadowColor = 'transparent';
      c.lineWidth = Math.max(1.5, w * .35);
      c.strokeStyle = s.color === '#ffffff' ? '#0f172a' : 'rgba(255,255,255,.9)';
      c.stroke();
    }
    return;
  }
  if (st === 'curved') {
    // Bow to the left of the direction of travel; the head follows the curve's tangent.
    const mx = (s.x1 + s.x2) / 2 - sin * len * .28, my = (s.y1 + s.y2) / 2 + cos * len * .28;
    const ea = Math.atan2(s.y2 - my, s.x2 - mx);
    const ex = s.x2 - Math.cos(ea) * hs * .8, ey = s.y2 - Math.sin(ea) * hs * .8;
    c.beginPath(); c.moveTo(s.x1, s.y1); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
    head(c, s.x2, s.y2, ea, hs);
    return;
  }
  const hasHead = st !== 'line';
  const sx = st === 'double' ? s.x1 + cos * hs * .8 : s.x1, sy = st === 'double' ? s.y1 + sin * hs * .8 : s.y1;
  const ex = hasHead ? s.x2 - cos * hs * .8 : s.x2, ey = hasHead ? s.y2 - sin * hs * .8 : s.y2;
  if (st === 'dashed') { c.setLineDash([w * 2.6, w * 2]); c.lineCap = 'butt'; }
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
  c.setLineDash([]);
  if (hasHead) head(c, s.x2, s.y2, ang, hs);
  if (st === 'double') head(c, s.x1, s.y1, ang + Math.PI, hs);
  if (st === 'dot') { c.beginPath(); c.arc(s.x1, s.y1, w * 1.7, 0, Math.PI * 2); c.fill(); }
}

const FONT = '"Segoe UI", -apple-system, sans-serif';
const darkInk = col => col === '#ffffff' || col === '#facc15' || col === '#f59e0b';

/** Geometry of a callout bubble centred on (bx, by). */
function calloutBox(s) {
  const fs = Math.round(fontPx(s) * .8), pad = Math.round(fs * .65), lh = fs * 1.25;
  ctx.save();
  ctx.font = `600 ${fs}px ${FONT}`;
  const lines = (s.text || '').split('\n');
  const tw = Math.max(fs * 3, ...lines.map(l => ctx.measureText(l).width));
  ctx.restore();
  const roundish = s.style === 'round';
  const textH = lines.length * lh - (lh - fs);
  const w = tw + pad * 2 + (roundish ? fs * 1.6 : 0);
  const h = textH + pad * 2 + (roundish ? fs * .9 : 0);
  return { x: s.bx - w / 2, y: s.by - h / 2, w, h, fs, pad, lh, lines, tw, tx: s.bx - tw / 2, ty: s.by - textH / 2 };
}

function bubblePath(c, s, b) {
  const st = s.style || 'bubble';
  c.beginPath();
  if (st === 'round') c.ellipse(s.bx, s.by, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
  else if (st === 'label') c.rect(b.x, b.y, b.w, b.h);
  else c.roundRect(b.x, b.y, b.w, b.h, Math.min(b.h / 2, b.fs * .7));
}

/** Tail: a wedge from the bubble centre to the tip. False when the tip is under the bubble. */
function tailPath(c, s, b) {
  const cx = s.bx, cy = s.by;
  if (Math.abs(s.tx - cx) <= b.w / 2 && Math.abs(s.ty - cy) <= b.h / 2) return false;
  const ang = Math.atan2(s.ty - cy, s.tx - cx), base = Math.min(b.w, b.h) * .3;
  const nx = -Math.sin(ang) * base / 2, ny = Math.cos(ang) * base / 2;
  c.beginPath();
  c.moveTo(cx + nx, cy + ny);
  c.lineTo(s.tx, s.ty);
  c.lineTo(cx - nx, cy - ny);
  c.closePath();
  return true;
}

function drawCallout(c, s, editing) {
  const b = calloutBox(s), st = s.style || 'bubble';
  // Bubble and tail are filled separately: as one path their windings can cancel and leave a hole.
  c.save();
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = unit() * 2; c.shadowOffsetY = unit() * .6;
  if (st === 'outline') {
    // Stroke both outlines, then fill over them so the tail joins the bubble seamlessly.
    c.lineWidth = unit() * 1.6 * Math.max(1, s.size * .8);
    c.strokeStyle = s.color;
    if (tailPath(c, s, b)) c.stroke();
    bubblePath(c, s, b); c.stroke();
    c.shadowColor = 'transparent';
    c.fillStyle = '#ffffff';
    if (tailPath(c, s, b)) c.fill();
    bubblePath(c, s, b); c.fill();
  } else {
    c.fillStyle = s.color;
    if (tailPath(c, s, b)) c.fill();
    bubblePath(c, s, b); c.fill();
  }
  c.restore();
  if (editing) return;
  c.save();
  c.font = `600 ${b.fs}px ${FONT}`;
  c.textBaseline = 'top';
  c.fillStyle = st === 'outline' || darkInk(s.color) ? '#0f172a' : '#ffffff';
  b.lines.forEach((l, i) => c.fillText(l, b.tx, b.ty + i * b.lh));
  c.restore();
}

function rectOf(s) { return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) }; }

function drawShape(c, s) {
  c.save();
  c.strokeStyle = c.fillStyle = s.color;
  c.lineJoin = 'round';
  const shadow = () => { c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = unit() * 1.5; c.shadowOffsetY = unit() * .4; };
  const r = rectOf(s);
  switch (s.type) {
    case 'arrow': shadow(); arrow(c, s); break;
    case 'callout': drawCallout(c, s, s === editingCallout); break;
    case 'rect': shadow(); c.lineWidth = unit() * s.size; c.strokeRect(r.x, r.y, r.w, r.h); break;
    case 'ellipse':
      shadow(); c.lineWidth = unit() * s.size;
      c.beginPath(); c.ellipse(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, r.h / 2, 0, 0, Math.PI * 2); c.stroke(); break;
    case 'highlight':
      c.globalAlpha = .38; c.globalCompositeOperation = 'multiply';
      c.fillStyle = s.color === '#ffffff' || s.color === '#0f172a' ? '#facc15' : s.color;
      c.fillRect(r.x, r.y, r.w, r.h); break;
    case 'pen':
      shadow(); c.lineWidth = unit() * s.size; c.lineCap = 'round';
      c.beginPath(); s.pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); break;
    case 'blur': {
      if (r.w < 2 || r.h < 2) break;
      const px = Math.max(6, Math.round(unit() * 4 * s.size));
      const tw = Math.max(1, Math.round(r.w / px)), th = Math.max(1, Math.round(r.h / px));
      const t = document.createElement('canvas'); t.width = tw; t.height = th;
      t.getContext('2d').drawImage(cv, r.x - origin.x, r.y - origin.y, r.w, r.h, 0, 0, tw, th);
      c.imageSmoothingEnabled = false;
      c.drawImage(t, 0, 0, tw, th, r.x, r.y, r.w, r.h);
      break;
    }
    case 'text': {
      const fs = fontPx(s);
      c.font = `700 ${fs}px "Segoe UI", -apple-system, sans-serif`;
      c.textBaseline = 'top';
      c.lineWidth = Math.max(2, fs / 7);
      c.strokeStyle = s.color === '#0f172a' ? '#ffffff' : 'rgba(0,0,0,.85)';
      s.text.split('\n').forEach((line, i) => {
        c.strokeText(line, s.x, s.y + i * fs * 1.2);
        c.fillText(line, s.x, s.y + i * fs * 1.2);
      });
      break;
    }
    case 'step': {
      const rad = unit() * 5.5 * s.size;
      shadow();
      c.beginPath(); c.arc(s.x, s.y, rad, 0, Math.PI * 2); c.fill();
      c.shadowColor = 'transparent';
      c.lineWidth = Math.max(2, rad / 7); c.strokeStyle = '#fff'; c.stroke();
      c.fillStyle = s.color === '#ffffff' || s.color === '#facc15' ? '#0f172a' : '#fff';
      c.font = `800 ${Math.round(rad * 1.15)}px "Segoe UI", -apple-system, sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(s.n), s.x, s.y + rad * .06);
      break;
    }
  }
  c.restore();
}

// Image coordinates of the canvas's top-left pixel. Shapes are stored in image coordinates;
// when they reach past the screenshot the canvas grows (with a white margin) to include them.
let origin = { x: 0, y: 0 };

function shapeBounds(s) {
  const u = unit(), m = u * 3;
  const box = (x0, y0, x1, y1, p) => ({ x0: Math.min(x0, x1) - p, y0: Math.min(y0, y1) - p, x1: Math.max(x0, x1) + p, y1: Math.max(y0, y1) + p });
  const join = (a, b) => ({ x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) });
  switch (s.type) {
    case 'arrow': {
      const p = Math.max(12, u * s.size * 4.2) * .6 + m;
      let b = box(s.x1, s.y1, s.x2, s.y2, p);
      if (s.style === 'curved') {
        const len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1), ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        const mx = (s.x1 + s.x2) / 2 - Math.sin(ang) * len * .14, my = (s.y1 + s.y2) / 2 + Math.cos(ang) * len * .14;
        b = join(b, box(mx, my, mx, my, p));
      }
      return b;
    }
    case 'rect': case 'ellipse': case 'highlight': case 'blur':
      return box(s.x1, s.y1, s.x2, s.y2, u * s.size + m);
    case 'pen': {
      const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
      return box(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), u * s.size + m);
    }
    case 'text': {
      const fs = fontPx(s), lines = s.text.split('\n');
      ctx.save();
      ctx.font = `700 ${fs}px ${FONT}`;
      const w = Math.max(...lines.map(l => ctx.measureText(l).width));
      ctx.restore();
      return { x0: s.x - m, y0: s.y - m, x1: s.x + w + m, y1: s.y + lines.length * fs * 1.2 + m };
    }
    case 'step':
      return box(s.x, s.y, s.x, s.y, u * 5.5 * s.size + m);
    case 'callout': {
      const b = calloutBox(s);
      return box(Math.min(b.x, s.tx), Math.min(b.y, s.ty), Math.max(b.x + b.w, s.tx), Math.max(b.y + b.h, s.ty), m);
    }
  }
  return null;
}

function render() {
  if (!base.naturalWidth) return;
  let x0 = 0, y0 = 0, x1 = base.naturalWidth, y1 = base.naturalHeight;
  for (const s of drawing ? [...shapes, drawing] : shapes) {
    const b = shapeBounds(s);
    if (!b) continue;
    x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
  }
  x0 = Math.floor(x0); y0 = Math.floor(y0);
  const w = Math.ceil(x1) - x0, h = Math.ceil(y1) - y0;
  origin = { x: x0, y: y0 };
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; fit(); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.setTransform(1, 0, 0, 1, -x0, -y0);
  ctx.drawImage(base, 0, 0);
  shapes.forEach(s => { if (!s.hidden) drawShape(ctx, s); });
  if (drawing) drawShape(ctx, drawing);
  if (selected && !exporting && shapes.includes(selected)) drawSelection(selected);
  $('undo').disabled = !undoStack.length;
  $('redo').disabled = !redoStack.length;
}

// ---------- selecting & editing ----------
function snapshot() {
  undoStack.push(JSON.stringify(shapes));
  if (undoStack.length > 200) undoStack.shift();
  redoStack = [];
  dirty = true;
}
function restore(json) {
  shapes = JSON.parse(json);
  select(null);
  dirty = true;
  render();
}

function select(s) {
  selected = s;
  renderOpts();
  render();
}

/** Grab points for the selected annotation (image coordinates). */
function handlesOf(s) {
  switch (s.type) {
    case 'arrow': return [{ id: 'p1', x: s.x1, y: s.y1 }, { id: 'p2', x: s.x2, y: s.y2 }];
    case 'rect': case 'ellipse': case 'highlight': case 'blur':
      return [{ id: 'nw', x: s.x1, y: s.y1 }, { id: 'ne', x: s.x2, y: s.y1 }, { id: 'sw', x: s.x1, y: s.y2 }, { id: 'se', x: s.x2, y: s.y2 }];
    case 'callout': return [{ id: 'tip', x: s.tx, y: s.ty }];
  }
  return [];
}

function drawSelection(s) {
  const b = shapeBounds(s), k = 1 / scale;
  ctx.save();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 1.5 * k;
  ctx.setLineDash([5 * k, 4 * k]);
  ctx.strokeStyle = '#38bdf8';
  ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  ctx.setLineDash([]);
  for (const h of handlesOf(s)) {
    ctx.beginPath();
    ctx.arc(h.x, h.y, 6 * k, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2 * k;
    ctx.strokeStyle = '#0284c7';
    ctx.stroke();
  }
  ctx.restore();
}

function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

/** Topmost annotation under the point, if any. */
function hitShape(p) {
  const tol = Math.max(8 / scale, unit() * 2);
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    if (s.hidden) continue;
    if (s.type === 'arrow') {
      if (s.style === 'curved') {
        const len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1), ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        const m = { x: (s.x1 + s.x2) / 2 - Math.sin(ang) * len * .14, y: (s.y1 + s.y2) / 2 + Math.cos(ang) * len * .14 };
        if (Math.min(segDist(p, { x: s.x1, y: s.y1 }, m), segDist(p, m, { x: s.x2, y: s.y2 })) <= tol + unit() * s.size) return s;
      } else if (segDist(p, { x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }) <= tol + unit() * s.size * (s.style === 'fat' ? 3 : 1)) return s;
      continue;
    }
    if (s.type === 'pen') {
      for (let j = 1; j < s.pts.length; j++) {
        if (segDist(p, { x: s.pts[j - 1][0], y: s.pts[j - 1][1] }, { x: s.pts[j][0], y: s.pts[j][1] }) <= tol + unit() * s.size) return s;
      }
      continue;
    }
    if (s.type === 'callout') {
      const b = calloutBox(s);
      if (p.x >= b.x - tol && p.x <= b.x + b.w + tol && p.y >= b.y - tol && p.y <= b.y + b.h + tol) return s;
      if (segDist(p, { x: s.bx, y: s.by }, { x: s.tx, y: s.ty }) <= tol) return s;
      continue;
    }
    const b = shapeBounds(s);
    if (b && p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1) return s;
  }
  return null;
}

function handleAt(s, p) {
  const r = 10 / scale;
  return handlesOf(s).find(h => Math.hypot(h.x - p.x, h.y - p.y) <= r)?.id || null;
}

const MOVE_KEYS = [['x1', 'y1'], ['x2', 'y2'], ['x', 'y'], ['tx', 'ty'], ['bx', 'by']];
function applyDrag(s, o, p) {
  const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (drag.kind === 'move') {
    for (const [kx, ky] of MOVE_KEYS) if (kx in o) { s[kx] = o[kx] + dx; s[ky] = o[ky] + dy; }
    if (o.pts) s.pts = o.pts.map(([x, y]) => [x + dx, y + dy]);
    return;
  }
  const h = drag.id;
  if (h === 'p1') { s.x1 = o.x1 + dx; s.y1 = o.y1 + dy; }
  else if (h === 'p2') { s.x2 = o.x2 + dx; s.y2 = o.y2 + dy; }
  else if (h === 'tip') { s.tx = o.tx + dx; s.ty = o.ty + dy; }
  else {
    if (h.includes('w')) s.x1 = o.x1 + dx; else s.x2 = o.x2 + dx;
    if (h.includes('n')) s.y1 = o.y1 + dy; else s.y2 = o.y2 + dy;
  }
}

function toolCursor() { return tool === 'text' ? 'text' : tool === 'select' ? 'default' : 'crosshair'; }
function setCursor(c) { cv.style.cursor = c; $('stage').style.cursor = c; }

function deleteSelected() {
  if (!selected) return;
  snapshot();
  shapes.splice(shapes.indexOf(selected), 1);
  select(null);
}

function fit() {
  if (!base.naturalWidth) return;
  // Leave room at the top for the style bar.
  const st = $('stage');
  scale = Math.min((st.clientWidth - 40) / cv.width, (st.clientHeight - 84) / cv.height, 1);
  cv.style.width = `${cv.width * scale}px`;
  cv.style.height = `${cv.height * scale}px`;
}
addEventListener('resize', fit);

function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale + origin.x, y: (e.clientY - r.top) / scale + origin.y };
}

function push(s) { snapshot(); shapes.push(s); selected = s; renderOpts(); render(); }

$('stage').addEventListener('mousedown', e => {
  if (e.button !== 0 || item?.kind !== 'image' || e.target === txt || e.target.closest('#opts')) return;
  e.preventDefault();
  const p = pos(e);
  commitText();
  // Existing annotations: handles of the selected one, then anything of this kind (or anything with Select).
  if (selected) {
    const h = handleAt(selected, p);
    if (h) { drag = { kind: 'handle', id: h, start: p, orig: JSON.parse(JSON.stringify(selected)), moved: false }; return; }
  }
  const hit = hitShape(p);
  if (hit && (tool === 'select' || hit === selected || hit.type === tool)) {
    select(hit);
    drag = { kind: 'move', start: p, orig: JSON.parse(JSON.stringify(hit)), moved: false };
    return;
  }
  select(null);
  if (tool === 'select') return;
  if (tool === 'text') { openText(p); return; }
  if (tool === 'step') { push({ type: 'step', x: p.x, y: p.y, n: shapes.filter(s => s.type === 'step').length + 1, color, size: sizeMult }); return; }
  if (tool === 'callout') {
    drawing = { type: 'callout', tx: p.x, ty: p.y, bx: p.x, by: p.y, text: 'Text', style: calloutStyle, color, size: sizeMult };
    return;
  }
  drawing = tool === 'pen'
    ? { type: 'pen', pts: [[p.x, p.y]], color, size: sizeMult }
    : { type: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y, color, size: sizeMult, style: tool === 'arrow' ? arrowStyle : undefined };
});
addEventListener('mousemove', e => {
  if (drag) {
    const p = pos(e);
    if (!drag.moved) {
      if (Math.hypot(p.x - drag.start.x, p.y - drag.start.y) * scale < 3) return;
      drag.moved = true;
      snapshot();
    }
    applyDrag(selected, drag.orig, p);
    render();
    return;
  }
  if (!drawing) {
    if (item?.kind !== 'image' || !e.target.closest?.('#stage')) return;
    const p = pos(e);
    const h = selected && handleAt(selected, p);
    const hit = !h && hitShape(p);
    setCursor(h ? 'grab' : hit && (tool === 'select' || hit === selected || hit.type === tool) ? 'move' : toolCursor());
    return;
  }
  const p = pos(e);
  if (drawing.type === 'pen') drawing.pts.push([p.x, p.y]);
  else if (drawing.type === 'callout') { drawing.bx = p.x; drawing.by = p.y; }
  else {
    drawing.x2 = p.x; drawing.y2 = p.y;
    if (e.shiftKey && (drawing.type === 'rect' || drawing.type === 'ellipse')) {
      const d = Math.max(Math.abs(p.x - drawing.x1), Math.abs(p.y - drawing.y1));
      drawing.x2 = drawing.x1 + Math.sign(p.x - drawing.x1) * d;
      drawing.y2 = drawing.y1 + Math.sign(p.y - drawing.y1) * d;
    }
  }
  render();
});
addEventListener('mouseup', () => {
  if (drag) { drag = null; render(); return; }
  if (!drawing) return;
  const d = drawing;
  drawing = null;
  if (d.type === 'callout') {
    // A plain click puts the bubble up and to the right of the point.
    if (Math.hypot(d.bx - d.tx, d.by - d.ty) < 6) { d.bx = d.tx + unit() * 45; d.by = d.ty - unit() * 32; }
    d.text = '';
    openCallout(d);
    return;
  }
  const big = d.type === 'pen' ? d.pts.length > 1 : Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 3;
  if (big) push(d); else render();
});

// Double-click text or a callout to change its words.
$('stage').addEventListener('dblclick', e => {
  if (item?.kind !== 'image' || e.target === txt) return;
  const hit = hitShape(pos(e));
  if (hit?.type === 'callout') editCallout(hit);
  else if (hit?.type === 'text') openText({ x: hit.x, y: hit.y }, hit);
});

// ---------- text ----------
const txt = $('txt');
let textAt = null;
function openText(p, existing = null) {
  commitText();
  textAt = { x: p.x, y: p.y, edit: existing };
  if (existing) { existing.hidden = true; select(null); }
  const r = cv.getBoundingClientRect(), sr = $('stage').getBoundingClientRect();
  const fs = fontPx({ size: existing ? existing.size : sizeMult }) * scale;
  Object.assign(txt.style, {
    display: 'block', left: `${r.left - sr.left + (p.x - origin.x) * scale}px`, top: `${r.top - sr.top + (p.y - origin.y) * scale}px`,
    fontSize: `${fs}px`, color: existing ? existing.color : color, height: `${fs * 1.3}px`, width: '80px', lineHeight: '1.2', fontWeight: '700', background: '', border: '',
  });
  txt.value = existing ? existing.text : '';
  if (existing) autosize();
  txt.focus();
  setTimeout(() => txt.focus(), 0);
}
function autosize() {
  txt.style.width = '10px';
  txt.style.width = `${Math.max(80, txt.scrollWidth + 8)}px`;
  txt.style.height = `${txt.scrollHeight}px`;
}
txt.addEventListener('input', () => { if (!editingCallout) autosize(); });
txt.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Escape') { txt.value = ''; commitText(); }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
});
txt.addEventListener('blur', () => commitText());
let editingCallout = null;
function placeCalloutEditor() {
  const s = editingCallout, b = calloutBox(s);
  const r = cv.getBoundingClientRect(), sr = $('stage').getBoundingClientRect();
  Object.assign(txt.style, {
    left: `${r.left - sr.left + (b.tx - origin.x) * scale - 2}px`, top: `${r.top - sr.top + (b.ty - origin.y) * scale - 1}px`,
    fontSize: `${b.fs * scale}px`, lineHeight: '1.25', fontWeight: '600', background: 'transparent', border: '0',
    color: s.style === 'outline' || darkInk(s.color) ? '#0f172a' : '#ffffff',
    width: `${b.tw * scale + 10}px`, height: `${b.lines.length * b.lh * scale + 4}px`,
  });
}
function openCallout(s) {
  commitText();
  snapshot();
  editingCallout = s;
  shapes.push(s);
  selected = s;
  textAt = { callout: true, isNew: true };
  txt.value = '';
  txt.style.display = 'block';
  render();
  placeCalloutEditor();
  txt.focus();
  setTimeout(() => txt.focus(), 0);
}
function editCallout(s) {
  commitText();
  snapshot();
  editingCallout = s;
  selected = s;
  textAt = { callout: true, isNew: false };
  txt.value = s.text;
  txt.style.display = 'block';
  render();
  placeCalloutEditor();
  txt.focus();
  txt.select();
}
txt.addEventListener('input', () => {
  if (!editingCallout) return;
  editingCallout.text = txt.value;
  render();
  placeCalloutEditor();
});
function commitText() {
  if (textAt?.callout) {
    const s = editingCallout, isNew = textAt.isNew;
    editingCallout = null;
    textAt = null;
    Object.assign(txt.style, { display: 'none', border: '', background: '' });
    s.text = txt.value.replace(/\s+$/, '');
    if (!s.text) {
      shapes.splice(shapes.indexOf(s), 1);
      if (isNew) undoStack.pop();
      selected = null;
    }
    renderOpts();
    render();
    return;
  }
  if (!textAt) return;
  const t = txt.value.replace(/\s+$/, '');
  const at = textAt;
  textAt = null;
  txt.style.display = 'none';
  if (at.edit) {
    const s = at.edit;
    delete s.hidden;
    if (t === s.text) { render(); return; }
    snapshot();
    if (t) { s.text = t; select(s); } else { shapes.splice(shapes.indexOf(s), 1); select(null); }
    return;
  }
  if (t) push({ type: 'text', x: at.x, y: at.y, text: t, color, size: sizeMult });
}

function undo() {
  commitText();
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(shapes));
  restore(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(shapes));
  restore(redoStack.pop());
}
$('undo').onclick = undo;
$('redo').onclick = redo;

// ---------- actions ----------
async function ensureSaved() {
  commitText();
  if (item.kind !== 'image' || !dirty) return;
  exporting = true;
  render();
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  exporting = false;
  render();
  const bytes = new Uint8Array(await blob.arrayBuffer());
  await invoke('save_edited', bytes, { headers: { 'x-id': id } });
  dirty = false;
  item.url = null;
  showUrl();
}

async function run(fn, okMsg) {
  try {
    await ensureSaved();
    const r = await fn();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
  } catch (err) {
    Modal.error('That did not work', err);
  }
}

function showUrl() {
  $('urlChip').style.display = item.url ? 'flex' : 'none';
  $('urlText').textContent = item.url || '';
}

$('copy').onclick = () => run(() => invoke('copy_image', { id }), 'Image copied — paste it anywhere');
$('copyVid').onclick = () => run(() => invoke('copy_file', { id }), 'Video copied — paste it into your chat');
$('copyFile').onclick = () => run(() => invoke('copy_file', { id }), 'File copied — paste it into your chat');
$('share').onclick = async () => {
  const b = $('share');
  b.disabled = true;
  await run(async () => { item.url = await invoke('share', { id }); showUrl(); }, 'Link copied to the clipboard');
  b.disabled = false;
};
$('saveAs').onclick = () => run(() => invoke('save_as', { id }), saved => saved ? 'Saved' : null);
$('urlChip').onclick = () => run(() => invoke('copy_text', { text: item.url }), 'Link copied');
$('hist').onclick = () => invoke('open_history');
$('del').onclick = async () => {
  if (!await Modal.confirm('Delete this capture?', 'It will be removed from your history and disk. Shared links stay online.', 'Delete', true)) return;
  await invoke('history_delete', { id });
  currentWindow().close();
};

addEventListener('keydown', e => {
  if (document.querySelector('.modal-back') || e.target === txt || textAt) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); (item.kind === 'image' ? $('copy') : $('copyVid')).click(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); $('saveAs').click(); return; }
  if (mod || item?.kind !== 'image') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); deleteSelected(); return; }
  if (e.key === 'Escape' && selected) { select(null); return; }
  const map = { v: 'select', a: 'arrow', c: 'callout', r: 'rect', e: 'ellipse', h: 'highlight', p: 'pen', t: 'text', n: 'step', b: 'blur' };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});

listen('shared', e => {
  const [sid, url] = e.payload;
  if (sid === id && item) { item.url = url; showUrl(); toast('Uploaded — link copied'); }
});

(async () => {
  try {
    item = await invoke('history_get', { id });
  } catch (err) {
    await Modal.error('Capture not found', err);
    currentWindow().close();
    return;
  }
  document.body.classList.add(item.kind);
  renderOpts();
  const when = new Date(item.created).toLocaleString();
  $('title').textContent = item.kind === 'image' ? 'Screenshot' : 'Screen recording';
  $('sub').textContent = `${item.width} × ${item.height}${item.kind === 'video' ? ` · ${fmtDuration(item.duration)}` : ''} · ${when}`;
  document.title = `myCapture — ${$('title').textContent}`;
  showUrl();
  if (item.kind === 'image') {
    base.onload = () => { cv.width = base.naturalWidth; cv.height = base.naturalHeight; fit(); render(); };
    base.src = fileUrl(item.file);
  } else {
    if (/\.gif$/i.test(item.file)) {
      $('video').style.display = 'none';
      $('gif').style.display = 'block';
      $('gif').src = fileUrl(item.file);
      $('title').textContent = 'Animated GIF';
    } else {
      $('video').src = fileUrl(item.file);
    }
  }
})();
</script>
</body>
</html>
