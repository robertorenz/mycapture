<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myCapture</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { background: transparent !important; overflow: hidden; }
  body { position: relative; width: 100vw; height: 100vh; }
  #stage { position: absolute; inset: 0; transition: opacity .08s; }
  body.busy #stage { opacity: 0; }

  /* The moon is centred on the docked screen edge, so only its inner half is visible. */
  #moon { position: absolute; width: 72px; height: 72px; display: grid; place-items: center; cursor: pointer; z-index: 2; }
  body.top #moon { left: calc(50% - 36px); top: -36px; }
  body.bottom #moon { left: calc(50% - 36px); bottom: -36px; }
  body.left #moon { top: calc(50% - 36px); left: -36px; }
  body.right #moon { top: calc(50% - 36px); right: -36px; }
  /* Layers: fixed glow, a slowly turning surface, fixed lighting on top, twinkling sparkles. */
  .orb {
    position: relative; width: 70px; height: 70px; pointer-events: none;
    --halo: #c8e4ff;
    filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .45));
    animation: shimmer 5s ease-in-out infinite;
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .orb img, .orb .globe, .orb .halo { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Every body but the moon is painted on the canvas by bodies.js, over a soft glow. */
  .orb .globe, .orb .halo { display: none; }
  body.planet .orb img { display: none; }
  body.planet .orb .globe, body.planet .orb .halo { display: block; }
  .orb .halo { border-radius: 50%; background: radial-gradient(circle, var(--glow) 0 40%, transparent 60%); }
  body.sun .orb .halo { background: radial-gradient(circle, rgba(255, 236, 170, .95) 0 34%, var(--glow) 42%, rgba(255, 140, 40, .35) 52%, transparent 70%); animation: corona 4s ease-in-out infinite; }
  @keyframes corona { 50% { transform: scale(1.07); opacity: .85; } }
  /* The comet's nucleus sits in a corner; flip it onto the half that's on screen. */
  body.comet.top .orb .globe, body.comet.top .tail { transform: scaleY(-1); }
  body.comet.left .orb .globe, body.comet.left .tail { transform: scaleX(-1); }
  /* The comet's tail sparkles (shared.css) show only while the comet is the launcher. */
  .tail { display: none; }
  body.comet .tail { display: block; }
  body.still .tail i { animation-play-state: paused; }
  /* Seconds per turn, set from Settings → Moon speed; hovering turns it about 3.75× faster. */
  :root { --turn: 75s; }
  .orb .surface { animation: turn var(--turn) linear infinite; }
  body.still .orb .surface { animation: none; }
  #moon:hover .orb, body.open #moon .orb { transform: scale(1.1); }
  #moon:hover .surface, body.open #moon .surface { animation-duration: calc(var(--turn) / 3.75); }
  .spark {
    position: absolute; width: 11px; height: 11px; color: #fff;
    filter: drop-shadow(0 0 3px rgba(220, 236, 255, .95));
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .spark svg { width: 100%; height: 100%; display: block; }
  .spark.s1 { right: 2px; top: 3px; }
  .spark.s2 { left: 1px; bottom: 9px; width: 7px; height: 7px; animation-delay: -1.6s; animation-duration: 4.1s; }
  .spark.s3 { right: 9px; bottom: 2px; width: 6px; height: 6px; animation-delay: -.7s; animation-duration: 5s; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.55) rotate(0deg); }
    45% { opacity: 1; transform: scale(1) rotate(25deg); }
    60% { opacity: .9; transform: scale(.9) rotate(30deg); }
  }
  @keyframes shimmer { 50% { filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .45)) drop-shadow(0 0 7px var(--halo)) brightness(1.06); } }
  @media (prefers-reduced-motion: reduce) { .orb, .orb .surface, .orb .halo, .spark { animation: none !important; } }

  .ray {
    position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    left: var(--sx); top: var(--sy);
    border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #2b3a5c, #141e33 70%);
    border: 2px solid rgba(214, 230, 255, .9); color: #e3edff;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .45), 0 0 0 4px rgba(170, 205, 255, .14);
    transform: scale(.2); opacity: 0; pointer-events: none;
    transition: left .28s cubic-bezier(.3, 1.4, .5, 1), top .28s cubic-bezier(.3, 1.4, .5, 1), transform .28s cubic-bezier(.3, 1.4, .5, 1), opacity .15s, background .15s;
  }
  .ray svg.i { width: 22px; height: 22px; }
  .ray:hover { background: radial-gradient(circle at 35% 30%, #ffffff, #b9cdf0 75%); color: #0b1220; border-color: #ffffff; }
  .ray .lbl {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; letter-spacing: .02em;
    background: rgba(11, 18, 32, .88); padding: 0 7px; border-radius: 6px; line-height: 17px; pointer-events: none;
  }
  body.bottom .ray .lbl { top: -21px; }
  body.open .ray.on { left: var(--x); top: var(--y); transform: scale(1); opacity: 1; pointer-events: auto; }
</style>
</head>
<body class="top">
<div id="stage">
  <div id="moon">
    <div class="orb" aria-label="myCapture">
      <img src="moon-glow.png" alt="">
      <img class="surface" src="moon-surface.png" alt="">
      <img src="moon-light.png" alt="">
      <div class="halo"></div>
      <canvas class="globe"></canvas>
      <span class="spark s1"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M10 0l1.8 8.2L20 10l-8.2 1.8L10 20l-1.8-8.2L0 10l8.2-1.8z"/></svg></span>
      <span class="spark s2"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M10 0l1.8 8.2L20 10l-8.2 1.8L10 20l-1.8-8.2L0 10l8.2-1.8z"/></svg></span>
      <span class="spark s3"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M10 0l1.8 8.2L20 10l-8.2 1.8L10 20l-1.8-8.2L0 10l8.2-1.8z"/></svg></span>
    </div>
  </div>

  <div class="ray main" data-act="capture"><span data-icon="crosshair"></span><span class="lbl">Capture</span></div>
  <div class="ray main" data-act="history"><span data-icon="history"></span><span class="lbl">History</span></div>
  <div class="ray main" data-act="more"><span data-icon="more"></span><span class="lbl">More</span></div>

  <div class="ray extra" data-act="camera"><span data-icon="webcam"></span><span class="lbl">Camera</span></div>
  <div class="ray extra" data-act="settings"><span data-icon="settings"></span><span class="lbl">Settings</span></div>
  <div class="ray extra" data-act="hide"><span data-icon="eyeoff"></span><span class="lbl" id="hideLbl">Hide moon</span></div>
  <div class="ray extra" data-act="quit"><span data-icon="power"></span><span class="lbl">Quit</span></div>
</div>
<script src="shared.js"></script>
<script src="bodies.js"></script>
<script>
addStrings({
  'Capture': 'Capturar',
  'History': 'Historial',
  'More': 'Más',
  'Camera': 'Cámara',
  'Settings': 'Configuración',
  'Hide moon': 'Ocultar luna',
  'Hide {0}': 'Ocultar {0}',
  'Quit': 'Salir',
});
translatePage();
hydrateIcons();
const body = document.body;
const moon = document.getElementById('moon');
let expanded = false, more = false, leaveTimer = null, edge = 'top', dragging = false;

function setEdge(e) {
  edge = e;
  body.classList.remove('top', 'bottom', 'left', 'right');
  body.classList.add(e);
}

// Fan the buttons out from the moon, away from the docked edge.
function layout() {
  const W = innerWidth, H = innerHeight;
  const [cx, cy, dx, dy] = {
    top: [W / 2, 0, 0, 1], bottom: [W / 2, H, 0, -1], left: [0, H / 2, 1, 0], right: [W, H / 2, -1, 0],
  }[edge];
  const place = (els, angles, r) => els.forEach((el, i) => {
    const a = angles[i] * Math.PI / 180;
    // For top/bottom docking, keep Capture on the left; for side docking, on top.
    const flip = edge === 'top' || edge === 'left' ? -1 : 1;
    const vx = dx * Math.cos(a * flip) - dy * Math.sin(a * flip);
    const vy = dx * Math.sin(a * flip) + dy * Math.cos(a * flip);
    el.style.setProperty('--x', `${cx + r * vx}px`);
    el.style.setProperty('--y', `${cy + r * vy}px`);
    el.style.setProperty('--sx', `${cx}px`);
    el.style.setProperty('--sy', `${cy}px`);
  });
  place([...document.querySelectorAll('.ray.main')], [-55, 0, 55], 100);
  place([...document.querySelectorAll('.ray.extra')], [-70, -24, 24, 70], 104);
}

function showSet() {
  document.querySelectorAll('.ray.main').forEach(el => el.classList.toggle('on', !more));
  document.querySelectorAll('.ray.extra').forEach(el => el.classList.toggle('on', more));
}

async function expand() {
  clearTimeout(leaveTimer);
  if (expanded || dragging) return;
  expanded = true;
  body.classList.add('busy');
  setEdge(await invoke('moon_expand'));
  requestAnimationFrame(() => {
    layout();
    body.classList.remove('busy');
    requestAnimationFrame(() => { body.classList.add('open'); showSet(); });
  });
}

async function collapse() {
  if (!expanded) return;
  expanded = false;
  more = false;
  body.classList.remove('open');
  document.querySelectorAll('.ray').forEach(el => el.classList.remove('on'));
  await new Promise(r => setTimeout(r, 160));
  if (expanded) return;
  body.classList.add('busy');
  setEdge(await invoke('moon_collapse'));
  requestAnimationFrame(() => body.classList.remove('busy'));
}

moon.addEventListener('mouseenter', () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(expand, 140); });
document.documentElement.addEventListener('mouseleave', () => {
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(collapse, 450);
});
document.addEventListener('mousemove', () => { if (expanded) clearTimeout(leaveTimer); });

// Drag the moon anywhere; when dropped it docks to the nearest screen edge. A plain click captures.
let down = null, moved = false, movePending = false;
moon.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  down = { x: e.screenX, y: e.screenY };
  moved = false;
  moon.setPointerCapture(e.pointerId);
});
moon.addEventListener('pointermove', async e => {
  if (!down) return;
  if (!moved && Math.hypot(e.screenX - down.x, e.screenY - down.y) > 4) {
    moved = true;
    dragging = true;
    clearTimeout(leaveTimer);
    // Drag the window as it is; moon_snap docks and collapses it on drop.
    expanded = false;
    more = false;
    body.classList.remove('open');
    document.querySelectorAll('.ray').forEach(el => el.classList.remove('on'));
    await invoke('moon_drag_begin');
  }
  if (moved && !movePending) {
    movePending = true;
    await invoke('moon_drag_move');
    movePending = false;
  }
});
moon.addEventListener('pointerup', async e => {
  if (!down) return;
  down = null;
  moon.releasePointerCapture(e.pointerId);
  if (moved) {
    setEdge(await invoke('moon_snap'));
    dragging = false;
  }
});

moon.addEventListener('click', async () => {
  if (moved) { moved = false; return; }
  if (more) { more = false; showSet(); return; }
  await collapse();
  invoke('begin_capture');
});

document.querySelectorAll('.ray').forEach(el => el.addEventListener('click', async e => {
  e.stopPropagation();
  const act = el.dataset.act;
  if (act === 'more') { more = true; showSet(); return; }
  await collapse();
  if (act === 'capture') invoke('begin_capture');
  if (act === 'history') invoke('open_history');
  if (act === 'settings') invoke('open_settings');
  if (act === 'camera') invoke('toggle_camera');
  if (act === 'hide') {
    const s = await invoke('get_settings');
    s.show_moon = false;
    await invoke('set_settings', { settings: s });
  }
  if (act === 'quit') invoke('quit');
}));

const TURN = { slow: 150, normal: 75, fast: 35, faster: 15 };
let turnSecs = TURN.normal;
function setSpeed(speed) {
  document.body.classList.toggle('still', speed === 'still');
  turnSecs = TURN[speed] || TURN.normal;
  document.documentElement.style.setProperty('--turn', `${turnSecs}s`);
  spinGlobe();
}

// Planets turn by redrawing the canvas only as often as the surface visibly moves.
const canvas = document.querySelector('.globe'), orb = document.querySelector('.orb');
canvas.insertAdjacentHTML('afterend', COMET_TAIL);
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let globe = null, spin = 0, last = 0, timer = null;
function spinGlobe() {
  clearTimeout(timer);
  timer = null;
  if (!globe) return;
  const now = performance.now(), still = body.classList.contains('still') || reduced.matches;
  const fast = moon.matches(':hover') || body.classList.contains('open');
  const secs = fast ? turnSecs / 3.75 : turnSecs;
  if (last && !still) spin += (now - last) / 1000 / secs;
  last = now;
  globe.draw(-spin);
  if (!still) timer = setTimeout(spinGlobe, Math.max(16, secs * 1000 * .15 / MAP_W));
}
let shownId = null;
function setBody(id) {
  const b = bodyOf(id);
  shownId = b.id;
  body.classList.remove(...BODIES.map(x => x.id));
  body.classList.add(b.id);
  body.classList.toggle('planet', b.id !== 'moon');
  orb.style.setProperty('--halo', b.halo);
  if (b.glow) orb.style.setProperty('--glow', b.glow);
  document.getElementById('hideLbl').textContent = b.id === 'moon' ? tr('Hide moon') : tr('Hide {0}', LANG === 'es' ? b.es : b.name);
  if (b.id === 'moon') { globe = null; spinGlobe(); return; }
  canvas.width = canvas.height = Math.round(70 * Math.max(1, devicePixelRatio || 1));
  globe ? globe.set(b.id) : (globe = new Globe(canvas, b.id));
  last = 0;
  spinGlobe();
}
// Random rolls a different body at start and again every `shuffleMins` (0 = only at start).
let look = 'moon', rollTimer = null, shuffleMins = 60;
const roll = () => setBody(pickBody(shownId));
function setLook(id) {
  look = id;
  if (id !== 'random') { clearInterval(rollTimer); return setBody(id); }
  roll();
  setShuffle(shuffleMins);
}
function setShuffle(mins) {
  shuffleMins = mins ?? 60;
  clearInterval(rollTimer);
  if (shuffleMins > 0 && look === 'random') rollTimer = setInterval(roll, shuffleMins * 60e3);
}
listen('moon-speed', e => setSpeed(e.payload));
listen('moon-body', e => setLook(e.payload));
listen('moon-shuffle', e => setShuffle(e.payload));
invoke('get_settings').then(s => {
  setEdge(s.moon_edge || 'top');
  setSpeed(s.moon_speed);
  shuffleMins = s.moon_shuffle ?? 60;
  setLook(s.moon_body);
});
</script>
</body>
</html>
