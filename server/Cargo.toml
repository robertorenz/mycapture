[package]
name = "mycapture-server"
version = "0.1.1"
edition = "2021"
description = "Tiny self-hosted upload server for myCapture captures"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
